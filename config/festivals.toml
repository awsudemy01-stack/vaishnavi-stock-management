# Festival calendar for demand forecasting (docs/10 §11, forecast/festivals.py).
#
# Each window multiplies the forecast daily rate for the listed product categories on those days.
# "*" applies to every category. Dates follow the lunar calendar — CHECK THEM EVERY YEAR (the owner
# can edit this file; the app re-reads it on start). Windows deliberately start a few days before the
# festival: that is when the shop sells, not on the day itself.

[[festival]]
name = "Maha Shivratri 2026"
start = "2026-02-12"
end = "2026-02-15"
uplift = { "Puja Samagri" = 1.6, "Flowers & Leaves" = 2.0, "*" = 1.2 }

