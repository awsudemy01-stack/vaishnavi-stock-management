# Plain-language texts for every error code (English — the fallback for other languages).
# msg = what it means · fix = what to do. Placeholders like {name} are filled by the code that raises.
# Keep in step with docs/08 §5 and with hi.toml (tests enforce identical code sets).
# Tables other than [errors] hold other owner-facing texts (core/i18n.py): doctor titles and lines.

[doctor]
header = "Vaishnavi Store Manager Health Check — {when}  (ref {ref})"
